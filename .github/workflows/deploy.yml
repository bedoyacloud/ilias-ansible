name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Servidor de destino"
        type: choice
        default: all
        options: [all, ilias-01, ilias-fresh, ilias-contabo]
      tags:
        description: "Que desplegar (all = todo el playbook)"
        type: choice
        default: plugins
        options: [plugins, all, ilias, nginx, php, mariadb, base, maintenance, metrics, monitoring]
      dry_run:
        description: "Solo el plan (--check --diff), sin aplicar cambios"
        type: boolean
        default: true

# Un solo despliegue a la vez
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
  SG_ID: ${{ vars.AWS_SG_ID }}
  TAGS: ${{ inputs.tags }}

jobs:
  # 0) Que servidores toca esta ejecucion. "aws" indica que su firewall (security group) hay que abrir para el runner.
  prepare:
    name: Elegir servidores
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          TARGET: ${{ inputs.target }}
        run: |
          ALL='[{"host":"ilias-01","aws":true},{"host":"ilias-fresh","aws":true},{"host":"ilias-contabo","aws":false}]'
          if [ "$TARGET" = "all" ]; then M="$ALL"; else M=$(echo "$ALL" | jq -c --arg t "$TARGET" '[.[] | select(.host == $t)]'); fi
          echo "matrix={\"include\":$M}" >> "$GITHUB_OUTPUT"

  # 1) PLAN: sin aprobacion, un job por servidor. Muestra que cambiaria en el resumen de la ejecucion.
  plan:
    name: Plan ${{ matrix.host }}
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      HOST: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: ./.github/actions/prepare
        with:
          ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}
          known_hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          inventory: ${{ secrets.INVENTORY_YML }}
          vault_files: ${{ secrets.VAULT_FILES_B64 }}

      # Los servidores de AWS solo aceptan SSH desde una IP: se abre para este runner y se cierra al terminar
      - name: Abrir SSH (22) a la IP de este runner
        if: ${{ matrix.aws }}
        run: |
          RUNNER_IP=$(curl -fsS https://checkip.amazonaws.com)
          echo "RUNNER_IP=$RUNNER_IP" >> "$GITHUB_ENV"
          aws ec2 authorize-security-group-ingress --group-id "$SG_ID" \
            --protocol tcp --port 22 --cidr "$RUNNER_IP/32" \
            --tag-specifications "ResourceType=security-group-rule,Tags=[{Key=Name,Value=github-actions-plan-$HOST}]"

      - name: Plan (--check --diff)
        working-directory: ansible
        run: |
          set -o pipefail
          ARGS=()
          [ "$TAGS" != "all" ] && ARGS+=(--tags "$TAGS")
          ansible-playbook playbooks/site.yml --check --diff --limit "$HOST" "${ARGS[@]}" | tee "$RUNNER_TEMP/plan.txt"

      - name: Publicar el plan en el resumen de la ejecucion
        if: always()
        run: |
          {
            echo "## Plan para \`$HOST\` (tags: \`$TAGS\`)"
            echo
            echo '```'
            grep -E "^(TASK|changed:|fatal:|PLAY RECAP|ilias-[a-z0-9]+ +:)|^[-+@]" "$RUNNER_TEMP/plan.txt" | grep -v "^ok:" | tail -150
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cerrar SSH y borrar secretos (siempre)
        if: always()
        run: |
          if [ -n "${RUNNER_IP:-}" ]; then
            aws ec2 revoke-security-group-ingress --group-id "$SG_ID" \
              --protocol tcp --port 22 --cidr "$RUNNER_IP/32"
          fi
          rm -f ~/.ssh/deploy_key ansible/inventory/hosts.yml ansible/inventory/group_vars/all/vault.yml ansible/inventory/host_vars/*/vault.yml

  # 2) APLICAR: pide aprobacion DESPUES de ver el plan. Solo si dry_run = false.
  apply:
    name: Aplicar ${{ matrix.host }}
    needs: [prepare, plan]
    if: ${{ inputs.dry_run == false }}
    runs-on: ubuntu-24.04
    # Aprobacion manual: Settings > Environments > production > Required reviewers
    environment: production
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      HOST: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: ./.github/actions/prepare
        with:
          ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}
          known_hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          inventory: ${{ secrets.INVENTORY_YML }}
          vault_files: ${{ secrets.VAULT_FILES_B64 }}

      - name: Abrir SSH (22) a la IP de este runner
        if: ${{ matrix.aws }}
        run: |
          RUNNER_IP=$(curl -fsS https://checkip.amazonaws.com)
          echo "RUNNER_IP=$RUNNER_IP" >> "$GITHUB_ENV"
          aws ec2 authorize-security-group-ingress --group-id "$SG_ID" \
            --protocol tcp --port 22 --cidr "$RUNNER_IP/32" \
            --tag-specifications "ResourceType=security-group-rule,Tags=[{Key=Name,Value=github-actions-deploy-$HOST}]"

      - name: Aplicar
        working-directory: ansible
        run: |
          ARGS=()
          [ "$TAGS" != "all" ] && ARGS+=(--tags "$TAGS")
          ansible-playbook playbooks/site.yml --limit "$HOST" "${ARGS[@]}"

      # Los puertos web solo estan abiertos para el administrador (o Cloudflare): la prueba se hace desde dentro del servidor
      - name: Prueba de humo (desde el propio servidor, por SSH)
        working-directory: ansible
        run: |
          IP=$(ansible-inventory --host "$HOST" | jq -r .ansible_host)
          URL=$(ansible "$HOST" -m ansible.builtin.debug -a 'msg={{ ilias_url }}' | grep -o 'https\?://[^" ]*' | head -1)
          SCHEME=${URL%%://*}; H=${URL#*://}; H=${H%%/*}; PORT=$([ "$SCHEME" = https ] && echo 443 || echo 80)
          SSH=(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "ubuntu@$IP")
          CODE=$("${SSH[@]}" "curl -sL -k -o /dev/null -w '%{http_code}' --resolve '$H:$PORT:127.0.0.1' '$URL/login.php'")
          echo "$HOST: $URL/login.php -> HTTP $CODE"
          echo "Plugins registrados en ILIAS (id, activo, version):"
          "${SSH[@]}" "sudo mariadb ilias -N -e 'SELECT plugin_id, active, last_update_version FROM il_plugin'"
          [ "$CODE" = "200" ]

      - name: Cerrar SSH y borrar secretos (siempre, aunque falle el despliegue)
        if: always()
        run: |
          if [ -n "${RUNNER_IP:-}" ]; then
            aws ec2 revoke-security-group-ingress --group-id "$SG_ID" \
              --protocol tcp --port 22 --cidr "$RUNNER_IP/32"
          fi
          rm -f ~/.ssh/deploy_key ansible/inventory/hosts.yml ansible/inventory/group_vars/all/vault.yml ansible/inventory/host_vars/*/vault.yml
