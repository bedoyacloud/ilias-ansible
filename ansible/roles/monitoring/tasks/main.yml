---
- name: Directorios de monitorizacion
  ansible.builtin.file:
    path: "{{ monitoring_dir }}/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - prometheus
    - grafana/provisioning/datasources
    - grafana/provisioning/dashboards
    - grafana/dashboards

- name: Configuracion de Prometheus (objetivos = servidores del grupo ilias)
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ monitoring_dir }}/prometheus/prometheus.yml"
    mode: "0644"
  notify: Restart monitoring

- name: Datasource de Grafana (Prometheus)
  ansible.builtin.template:
    src: grafana-datasource.yml.j2
    dest: "{{ monitoring_dir }}/grafana/provisioning/datasources/prometheus.yml"
    mode: "0644"
  notify: Restart monitoring

- name: Proveedor de dashboards de Grafana
  ansible.builtin.template:
    src: grafana-dashboards.yml.j2
    dest: "{{ monitoring_dir }}/grafana/provisioning/dashboards/default.yml"
    mode: "0644"
  notify: Restart monitoring

- name: Descargar el dashboard Node Exporter Full
  ansible.builtin.get_url:
    url: "https://grafana.com/api/dashboards/{{ monitoring_dashboard_id }}/revisions/{{ monitoring_dashboard_revision }}/download"
    dest: "{{ monitoring_dir }}/grafana/dashboards/node-exporter-full.json"
    mode: "0644"

- name: Dashboard propio con una seccion por servidor
  ansible.builtin.copy:
    src: ilias-servidores.json
    dest: "{{ monitoring_dir }}/grafana/dashboards/ilias-servidores.json"
    mode: "0644"

- name: El dashboard apunta al datasource provisionado
  ansible.builtin.replace:
    path: "{{ monitoring_dir }}/grafana/dashboards/node-exporter-full.json"
    regexp: '\$\{DS_PROMETHEUS\}'
    replace: prometheus

- name: Contrasena del administrador de Grafana (fichero solo para root)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ monitoring_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart monitoring

- name: Fichero docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ monitoring_dir }}/docker-compose.yml"
    mode: "0644"
  notify: Restart monitoring

- name: Prometheus y Grafana en marcha
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_dir }}"
    state: present

# --- Acceso publico por dominio (opcional): nginx como proxy de Grafana ---
- name: Acceso publico a Grafana por dominio
  when: monitoring_domain | length > 0
  block:
    - name: Instalar nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        cache_valid_time: 3600

    - name: Virtual host de Grafana
      ansible.builtin.template:
        src: grafana-nginx.conf.j2
        dest: /etc/nginx/sites-available/grafana
        mode: "0644"
      notify: Reload nginx for monitoring

    - name: Activar el virtual host de Grafana
      ansible.builtin.file:
        src: /etc/nginx/sites-available/grafana
        dest: /etc/nginx/sites-enabled/grafana
        state: link
      notify: Reload nginx for monitoring

    - name: Validar la configuracion de nginx
      ansible.builtin.command: nginx -t
      changed_when: false
