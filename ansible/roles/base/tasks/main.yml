---
- name: Actualizar el sistema
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    cache_valid_time: 3600

- name: Zona horaria UTC
  community.general.timezone:
    name: Etc/UTC

# --- Swap: el servidor de la PoC tiene 2 GB de RAM ---
- name: Crear el fichero de swap
  ansible.builtin.command: "fallocate -l {{ swap_size }} /swapfile"
  args:
    creates: /swapfile

- name: Permisos del swap (solo root)
  ansible.builtin.file:
    path: /swapfile
    owner: root
    group: root
    mode: "0600"

- name: Dar formato de swap
  ansible.builtin.command: mkswap /swapfile
  when: ansible_facts.swaptotal_mb == 0 and ansible_facts.mounts | selectattr('mount', 'equalto', '/swapfile') | list | length == 0
  changed_when: true

- name: Activar el swap en cada arranque
  ansible.posix.mount:
    src: /swapfile
    path: none
    fstype: swap
    opts: sw
    state: present

- name: Activar el swap ahora
  ansible.builtin.command: swapon /swapfile
  when: ansible_facts.swaptotal_mb == 0
  changed_when: true

- name: Usar swap solo si hace falta (swappiness)
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "10"
    sysctl_file: /etc/sysctl.d/99-swap.conf
    state: present
    reload: true

# --- Seguridad ---
- name: Paquetes de seguridad
  ansible.builtin.apt:
    name:
      - ufw
      - fail2ban
      - unattended-upgrades
    state: present

- name: Politica por defecto del firewall - denegar entrada
  community.general.ufw:
    default: deny
    direction: incoming

- name: Permitir los puertos necesarios (SSH antes de activar)
  community.general.ufw:
    rule: allow
    name: "{{ item if item is not search('/') else omit }}"
    port: "{{ item.split('/')[0] if item is search('/') else omit }}"
    proto: "{{ item.split('/')[1] if item is search('/') else omit }}"
  loop: "{{ ssh_allowed_ports }}"

- name: Activar el firewall
  community.general.ufw:
    state: enabled

- name: Activar fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

- name: Actualizaciones de seguridad automaticas
  ansible.builtin.service:
    name: unattended-upgrades
    state: started
    enabled: true
