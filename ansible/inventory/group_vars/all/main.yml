---
# Variables comunes a todos los servidores. Los secretos NO van aqui: ver vault.example.yml

# --- ILIAS ---
ilias_version: v11.5                 # tag de https://github.com/ILIAS-eLearning/ILIAS
ilias_client_id: pocilias
ilias_url: "http://{{ ansible_host }}"   # con dominio y HTTPS: "https://ilias.ejemplo.com"
ilias_root: /var/www/ilias
ilias_data_dir: /var/www/files
ilias_config_dir: /var/www/config
ilias_log_dir: /var/www/logs
ilias_contact:
  firstname: Admin
  lastname: ILIAS
  email: admin@example.com
ilias_cron_user: root                # en produccion: crear un usuario dedicado (ver docs)

# --- Base de datos ---
ilias_db_name: ilias
ilias_db_user: ilias
mariadb_buffer_pool: 256M            # 1G o mas en produccion

# --- PHP ---
php_version: "8.3"
php_fpm_max_children: 6
php_cookie_secure: "Off"             # "On" cuando haya HTTPS

# --- nginx ---
nginx_server_name: "_"               # con dominio: "ilias.ejemplo.com"
nginx_default_server: true           # false si el servidor ya tiene otro default_server
nginx_tls: false                     # true: HTTPS (y redireccion 80 -> 443)
nginx_tls_cert: /etc/ssl/cloudflare/origin.pem
nginx_tls_key: /etc/ssl/cloudflare/origin.key

# --- Sistema ---
manage_system: true                  # false: no tocar firewall, swap ni actualizaciones (servidor compartido)

# --- Metricas (Prometheus + Grafana) ---
node_exporter_port: 9100             # lo usan node_exporter (escucha) y monitoring (consulta)

# --- Node ---
node_major: "22"

# --- Sistema ---
swap_size: 2G
ssh_allowed_ports: [OpenSSH, "80/tcp"]

# --- Backups ---
backup_dir: /var/backups/ilias
backup_keep_days: 7
backup_hour: 2
backup_minute: 30
# Copia cifrada fuera del servidor con restic. Vacio = desactivada. Ejemplos: s3:s3.amazonaws.com/MI-BUCKET/ilias  |  sftp:usuario@host:/ruta
backup_restic_repo: ""
backup_restic_env: {}                # credenciales del destino (AWS_ACCESS_KEY_ID...): ponerlas en host_vars/<servidor>/vault.yml
# URL "push" de un monitor (p. ej. Uptime Kuma): el script la llama al terminar bien. Es secreta: ponerla en hosts.yml, no aqui.
backup_heartbeat_url: ""

# --- Plugins (addons) de ILIAS ---
# La lista de cada servidor va en inventory/host_vars/<servidor>/plugins.yml (se versiona: un cambio de addon es un cambio de codigo).
# Formato de cada elemento (ver roles/ilias_plugins/defaults/main.yml):
#   - { name: GeoGebra, id: srgg, repo: https://github.com/surlabs/GeoGebraForILIAS.git, version: release_11, slot: Services/COPage/PageComponent }
ilias_plugins_list: []
